title: 'Newton''s Laws'
question: 'If I hide the motion and show only the free-body diagram, can you still say the acceleration?'
blurb: >-
  Motion changes when interactions happen. Mass is resistance to that change, and forces come in pairs that never appear on the same diagram. This is where the most common wrong belief in physics lives: that motion requires a force.
