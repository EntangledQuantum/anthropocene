title: 'Gravitation'
question: 'Fire a cannonball sideways from a mountain. How fast before it never comes down?'
blurb: >-
  The same inverse-square law holds the apple and the Moon. An orbit is a fall that keeps missing the ground, fast where it is near and slow where it is far, and a launch √2 times faster than a circle never comes back.
