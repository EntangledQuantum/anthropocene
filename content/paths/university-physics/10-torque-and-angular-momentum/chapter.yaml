title: 'Dynamics of Rotational Motion'
question: 'If the skater pulls in her arms, what stayed constant — I, omega, L, or K?'
blurb: >-
  Torque is the rotational costume of force, angular momentum the rotational costume of momentum. A spinning wheel refusing to fall over is not magic, it is an L arrow being steered.
