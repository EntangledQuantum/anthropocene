title: 'Capacitance and Dielectrics'
question: 'Disconnect the battery, slide in a dielectric. What stays put - Q or V?'
blurb: >-
  A capacitor stores separated charge, and therefore energy, in a field. The energy is in the field itself, which is a strange thing to say until you can see where it sits.
