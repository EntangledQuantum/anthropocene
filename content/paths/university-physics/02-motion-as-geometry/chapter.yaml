title: 'Motion Along a Line'
question: 'Given only v(t), can you recover x(t), and what is missing?'
blurb: >-
  Drive a lift by hand and by lever and watch it write its own graph: speed is how steep the trace is, distance is the area under the velocity. Then the simplest useful case, constant acceleration, where twice as fast means four times as far.
order: 2
