title: 'University Physics'
subtitle: 'the structures, before the formulas that caption them'
blurb: >-
  Calculus-based university physics, built so that you move the world first and
  meet the symbols afterwards. A small set of structures - rate, accumulation,
  interaction, ledger, field, wave, ensemble, amplitude - wearing many costumes:
  a marble on a potential track becomes an LC loop becomes a finite well. Every
  lesson is a visual world you can break, not a derivation you watch.
