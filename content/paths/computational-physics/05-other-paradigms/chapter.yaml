title: 'The Other Paradigms'
question: 'What if stepping through time is the wrong idea entirely?'
blurb: >-
  Everything so far marched forward in small steps. These do not. Spectral
  methods solve in frequency space; variational integrators discretise the
  action instead of the equations; Monte Carlo abandons determinism to beat
  dimensionality; differentiable simulation makes the solver itself something
  you can optimise through.
order: 5
status: 'live'
