title: 'Static friction'
blurb: 'A surface grips back exactly as hard as it must to stop the slipping, up to a ceiling of μₛ N. Below the ceiling it has no value of its own; at the ceiling the object goes.'
notation: '0 \le |f_s| \le \mu_s N'
tags:
  - 'up-ch5'
misconceptions:
  - id: 'static-friction-single-value'
    name: 'Static friction is μₛ N.'
    signal: 'Writes f = μₛ N for a crate that is not moving, and so finds a friction force bigger than the push it is resisting.'
    correction: 'μₛ N is the most the surface can give, not what it is giving. A crate you push with 5 N gets 5 N back. If friction really were μₛ N while you pushed gently, it would drag the crate backwards towards you.'
  - id: 'no-motion-no-friction'
    name: 'Nothing is sliding, so there is no friction.'
    signal: 'Leaves friction off the diagram of a crate being pushed that does not move, or of a block resting on a ramp.'
    correction: 'Something has to cancel your push, or the crate would accelerate. That something is static friction, and it is working hardest exactly when the crate is on the edge of moving and still not moving at all.'
  - id: 'friction-opposes-motion'
    name: 'Friction always points against the direction of motion.'
    signal: 'Draws friction backward on a crate carried forward in an accelerating truck, or on the drive wheels of a car pulling away.'
    correction: 'Friction opposes slipping between the two surfaces, not motion. The truck bed lurches forward under the crate; the slip it would cause is the crate sliding backward, so friction pushes the crate forward. It is the only forward force the crate has, which is how the crate keeps up.'
  - id: 'heavier-slips-sooner'
    name: 'A heavier block slides off a tilted ramp first, or needs a steeper ramp.'
    signal: 'Predicts different slip angles for two blocks of the same material and different mass.'
    correction: 'Doubling the mass doubles the pull down the slope and doubles the normal force, so it doubles the grip limit too. The race between them is the same race at any mass: tan θ = μₛ.'
