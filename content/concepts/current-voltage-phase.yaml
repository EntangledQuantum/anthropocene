title: 'Current and voltage out of step'
blurb: 'In a resistor current and voltage peak together. A capacitor''s current peaks a quarter cycle before its voltage, because current is how fast its charge changes; a coil''s current peaks a quarter cycle after, because its voltage is how fast its current changes.'
notation: 'i_C = C\,\dfrac{dv}{dt}\ \text{(leads by } 90^\circ),\qquad v_L = L\,\dfrac{di}{dt}\ \text{(current lags by } 90^\circ)'
tags:
  - 'up-ch31'
misconceptions:
  - id: 'up-ch31-current-follows-voltage'
    name: 'Current always peaks when the voltage peaks.'
    signal: 'Applies Ohm''s-law timing to a capacitor or a coil: most voltage, most current, at the same instant.'
    correction: 'That timing holds for a resistor only. A capacitor''s current is the rate its charge changes, which is zero at the voltage peak, when the plates are fullest. A coil''s voltage sets how fast its current changes, so its current peaks when the voltage passes through zero.'
  - id: 'up-ch31-capacitor-current-late'
    name: 'A capacitor''s current comes after its voltage, as the plates catch up.'
    signal: 'Pictures charge arriving late on the plates and puts the current peak after the voltage peak.'
    correction: 'The charge on the plates is the voltage, times C, at every instant; nothing lags. The plates fill fastest as the voltage climbs through zero, so the current peaks there, a quarter cycle before the voltage does.'
  - id: 'up-ch31-capacitor-blocks-ac'
    name: 'No current flows in a capacitor circuit, because charge cannot cross the gap.'
    signal: 'Expects an ammeter in series with a capacitor on AC to read zero.'
    correction: 'No charge crosses the gap, but charge flows onto one plate and off the other through the wires, reversing every half cycle. The ammeter in the wire reads that flow, and it is as real as any other current.'
  - id: 'up-ch31-coil-like-capacitor'
    name: 'A coil''s current leads its voltage, like a capacitor''s.'
    signal: 'Carries the capacitor''s quarter-cycle lead over to a coil.'
    correction: 'A coil does the opposite job. Its voltage is L times the rate its current changes, so the voltage peaks while the current is climbing through zero, and the current peaks a quarter cycle later.'
