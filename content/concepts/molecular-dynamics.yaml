title: 'Molecular dynamics'
blurb: 'Thermodynamics as a time average of a symplectic map. A thermostat is a modification of the dynamics, not a better integrator.'
notation: 'T = K/N \quad (2D),\quad P = \rho T + \Xi/(2A)'
tags:
  - ch5
misconceptions:
  - id: 'md-order-beats-structure'
    name: 'RK4 is higher order, so it is the better integrator for a gas.'
    signal: 'Picks RK4 for a long N-body run because its local error is smaller.'
    correction: 'MD is a long Hamiltonian integration. Verlet’s per-step error is larger, but it is bounded by a shadow Hamiltonian and costs one force evaluation. RK4’s smaller error points the same way every step, so it accumulates, and it costs four force evaluations — the expensive part of MD.'
  - id: 'md-gas-has-no-orbit'
    name: 'A gas has no orbit, so energy conservation is optional.'
    signal: 'Treats bounded energy as a planetary-orbit concern, not a many-particle one.'
    correction: 'The gas is still a Hamiltonian system. Temperature and pressure are time averages of that trajectory. If the discrete map bleeds energy, the thermodynamics you measure is of a different system than the one you wrote down.'
  - id: 'md-thermostat-conserves-energy'
    name: 'Holding T also holds E, because they are the same thing.'
    signal: 'Expects the Verlet energy band to survive a thermostat, or thinks a thermostat is still symplectic.'
    correction: 'T is mean kinetic energy; E is kinetic plus potential. A thermostat is a different set of equations, chosen so E can fluctuate (or be driven) while T is controlled. Velocity rescaling has no shadow Hamiltonian. Nosé–Hoover conserves an extended quantity, not the original H.'
  - id: 'md-temperature-is-an-input'
    name: 'Temperature is a parameter you set on the integrator.'
    signal: 'Looks for a T knob on Verlet, or treats the instantaneous kinetic energy as the thermodynamic temperature.'
    correction: 'In NVE there is no T input. Temperature is an output: the time average of K/N. A thermostat adds a bath so that average is the number you chose — by changing the dynamics.'
references:
  - label: 'Frenkel & Smit, Understanding Molecular Simulation'
    url: 'https://doi.org/10.1016/B978-0-12-267351-1.X5000-7'
  - label: 'Verlet 1967, Computer experiments on classical fluids'
    url: 'https://doi.org/10.1103/PhysRev.159.98'
  - label: 'Hoover 1985, Canonical dynamics'
    url: 'https://doi.org/10.1103/PhysRevA.31.1695'
