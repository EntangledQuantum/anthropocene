title: 'Constrained integration'
blurb: 'A constraint is part of the discrete map. Leaving the manifold is not a small error — it is a different object.'
notation: 'g(q_{n+1}) = 0'
tags:
  - ch4
misconceptions:
  - id: 'index-reduction-enough'
    name: 'Put the constraint in the ODE and a good integrator will stay on the manifold.'
    signal: 'Treats index reduction as a substitute for a constrained map, or expects RK4 on the twice-differentiated constraint to keep |q| = 1.'
    correction: 'The flow of the index-reduced ODE stays on the circle. A discrete map of that ODE does not. The manifold is a property of the update, not a leftover of the vector field.'
  - id: 'renorm-is-shake'
    name: 'Dividing by |q| after the step is SHAKE.'
    signal: 'Treats renormalisation or Gram–Schmidt as the constraint force, or claims SHAKE is a cleanup applied to an unconstrained step.'
    correction: 'SHAKE chooses λ so the Verlet step itself lands on g(q_{n+1}) = 0, with the force along ∇g at the old point. Projecting afterwards is a different map: a different direction, and not symplectic.'
  - id: 'slightly-wrong-rotation'
    name: 'A matrix that left SO(3) is still a slightly wrong rotation.'
    signal: 'Reads RᵀR ≠ I as an angle error, or expects RK4 on the nine entries to stay orthogonal up to the local truncation error.'
    correction: 'A rotation preserves lengths and angles. Once RᵀR leaves I, the linear map stretches. That is a different object, not a rotation with a small phase error.'
  - id: 'cleanup-after'
    name: 'Constraints are a cleanup you apply after integrating.'
    signal: 'Plans to integrate freely and project when the residual looks bad, or treats the multiplier as optional post-processing.'
    correction: 'If the discrete map is not required to land on the manifold, the next state is already the wrong mechanical system. The constraint belongs inside the update.'
references:
  - label: 'Ryckaert, Ciccotti, Berendsen, SHAKE (1977)'
    url: 'https://doi.org/10.1016/0021-9991(77)90098-5'
  - label: 'Andersen, RATTLE (1983)'
    url: 'https://doi.org/10.1016/0021-9991(83)90014-1'
  - label: 'Leimkuhler & Skeel, symplectic constrained integrators (1994)'
    url: 'https://doi.org/10.1006/jcph.1994.1039'
