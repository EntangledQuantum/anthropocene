title: 'Sound as a pressure wave'
blurb: 'Sound is air shuffling back and forth along the direction the wave travels, crowding into compressions and thinning into rarefactions. The squeeze sits where the displacement crosses zero, a quarter-wave from where the air has moved farthest.'
notation: 'p(x,t) = -B\,\frac{\partial s}{\partial x}'
tags: ['up-ch16']
misconceptions:
  - id: 'up-ch16-sound-carries-air'
    name: 'Sound carries the air along with it, from the source to you.'
    signal: 'Predicts that a dust speck in front of a speaker drifts away from it while the note plays.'
    correction: 'Each bit of air shuffles back and forth about its own home and ends each cycle where it started. What travels is the crowding, the pattern, not the air.'
  - id: 'up-ch16-sound-is-transverse'
    name: 'Sound makes the air bob up and down across its path, like a ripple on water.'
    signal: 'Pictures sound as the sine curve on a diagram and moves the air along that curve.'
    correction: 'In air the motion is along the direction of travel, toward and away from the source. The sine curve on a graph is displacement plotted sideways, not a shape the air takes.'
  - id: 'up-ch16-only-pressure-travels'
    name: 'Only the pressure moves in a sound wave; the air itself stays still.'
    signal: 'Chooses that a dust speck is perfectly still while the sound passes.'
    correction: 'Pressure can only rise because air moves and crowds. Every parcel moves, a few micrometres there and back, and the crowding it causes is the pressure.'
  - id: 'up-ch16-squeeze-at-biggest-shift'
    name: 'The air is most compressed where it has been displaced the most.'
    signal: 'Places the pressure peak at the peak of the displacement curve.'
    correction: 'Where the air has moved farthest, its neighbours have moved just as far, so nothing is squeezed. The squeeze is where the air behind has moved forward and the air ahead has moved back: where the displacement crosses zero.'
  - id: 'up-ch16-sound-needs-air'
    name: 'Sound needs air specifically.'
    signal: 'Is surprised that sound travels through water, steel or the ground.'
    correction: 'Any material with stiffness and inertia carries a pressure wave: water, steel, rock. Only a vacuum, with nothing to squeeze, is silent.'
