title: 'Smoothed particle hydrodynamics'
blurb: 'Density is a kernel sum over disordered points. There is no mesh. The same kernel that estimates ρ makes tension a negative modulus.'
notation: '\rho_i = \sum_j m_j W(|x_i - x_j|, h)'
tags:
  - ch5
misconceptions:
  - id: 'sph-needs-mesh'
    name: 'SPH still needs a background grid; the particles only carry mass.'
    signal: 'Looks for a PIC-style deposit, or treats the kernel as interpolation onto nodes.'
    correction: 'There is no mesh. Density at a particle is the kernel-weighted sum of neighbour masses, including itself. The kernel is the cell.'
  - id: 'sph-count-neighbours'
    name: 'Density is neighbour-count divided by the volume of a ball of radius h.'
    signal: 'Treats W as a hard cutoff, or writes ρ = N m / (4/3 π h³).'
    correction: 'A top-hat ball is a kernel, and a bad one — discontinuous, gradient zero almost everywhere. The cubic spline weights by distance, includes self, and has a derivative you can use as a discrete gradient.'
  - id: 'sph-surface-is-thinner'
    name: 'A free-surface particle is less dense because the fluid is actually thinner there.'
    signal: 'Reads the drop in the kernel sum as a physical rarefaction, or tries to fix it by changing the mass.'
    correction: 'The mass did not leave. Neighbours on the empty side are missing, so the kernel is incomplete. Completeness, not the continuum, is what failed.'
  - id: 'sph-tension-is-stable'
    name: 'The kernel that is stable in compression is stable in tension.'
    signal: 'Expects negative pressure to spread particles uniformly, or treats clumping as a time-step error.'
    correction: 'Swegle’s criterion: the product of stress and W″ sets the effective modulus. For the cubic spline, W″ changes sign inside the support, so tension is a negative modulus. Particles pair. That is a property of the kernel, not of Δt.'
  - id: 'sph-is-md'
    name: 'SPH is molecular dynamics with a different pair potential.'
    signal: 'Looks for a stored V(r), or treats the particles as molecules of the fluid.'
    correction: 'MD’s force comes from a prescribed V(r). SPH’s force comes from an equation of state on a kernel-estimated continuum field. The particles are interpolation points. Shrink h (and the spacing with it) and you are converging a PDE, not resolving molecules.'
