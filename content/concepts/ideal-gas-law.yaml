title: 'Ideal gas law'
blurb: 'Pressure, volume, temperature and the number of molecules are not independent: PV = NkT, with T in kelvin. It is the dilute limit of every real gas, not a perfect substance.'
notation: 'PV = NkT = nRT'
tags:
  - 'up-ch18'
misconceptions:
  - id: 'celsius-is-absolute'
    name: 'Doubling the Celsius temperature doubles the pressure.'
    signal: 'Predicts that heating a sealed box from 20 °C to 40 °C doubles its pressure.'
    correction: 'Pressure is proportional to temperature measured from where molecular motion stops, 0 K. 20 °C is 293 K and 40 °C is 313 K, so the pressure rises by under 7%. Doubling it takes 586 K, which is 313 °C.'
  - id: 'ideal-gas-is-perfect'
    name: 'The ideal gas law is exact for any gas.'
    signal: 'Expects a gas squeezed to a tenth of its volume to push exactly ten times harder.'
    correction: 'The law pretends the molecules take up no room. Squeeze the box to a tenth and the molecules cover a quarter of the floor; the free room shrinks faster than the box, and the pressure comes out near 18×, not 10×. PV = NkT is the limit a gas approaches as it thins out.'
  - id: 'collisions-drain-pressure'
    name: 'Collisions between molecules slow them down and lower the pressure.'
    signal: 'Predicts that a crowded gas pushes less than the ideal law says because the molecules get in each other''s way.'
    correction: 'The collisions are elastic: they redirect molecules without taking energy. Crowding does the opposite of what this predicts. The molecules'' own size shortens every trip to the wall, so hits come more often and the pressure rises above the ideal value.'
