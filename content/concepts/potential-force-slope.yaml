title: 'Force from a potential slope'
blurb: 'Read the direction and magnitude of a one-dimensional conservative force from the negative local slope of its potential energy.'
notation: 'F_x = -\frac{dU}{dx}'
tags: ['up-ch7']
misconceptions:
  - id: 'up-ch7-higher-means-stronger'
    name: 'Higher potential energy means a stronger force.'
    signal: 'Chooses a high, almost flat shelf over a lower steep slope.'
    correction: 'Force reads local slope, not height. A high flat region can have zero force; a lower steep region can have a large force.'
  - id: 'up-ch7-force-points-uphill'
    name: 'Force follows the positive slope of U.'
    signal: 'Draws force toward increasing potential energy.'
    correction: 'The conservative force points toward decreasing U. Positive slope means negative force, and negative slope means positive force.'
  - id: 'up-ch07-same-weight-same-push'
    name: 'Equal weights get equal pushes wherever they sit.'
    signal: 'Predicts two identical carts on a track pick up speed equally fast because gravity is the same m g on both.'
    correction: 'Only the part of gravity along the rail moves the cart, and that part is the slope of U along the rail. On a nearly level shelf it is close to zero; on a steep drop it is most of m g.'
  - id: 'up-ch07-strongest-at-the-bottom'
    name: 'The force is strongest at the bottom of a well.'
    signal: 'Places a bond at its lowest energy when asked where it pulls hardest.'
    correction: 'The bottom of a well is flat, so the force there is zero. The strongest pull is where the wall is steepest.'
