title: 'Young''s modulus'
blurb: 'Stiffness of a material in tension: stress over strain while it is still springing back. Copper is about 117 GPa, steel about 200 GPa, rubber a few MPa.'
notation: 'E = \frac{\sigma}{\varepsilon} = \frac{F L}{A\,\Delta L}'
tags:
  - 'up-ch11'
misconceptions:
  - id: 'stiff-means-strong'
    name: 'Stiff and strong are the same word.'
    signal: 'Expects the material that stretches least under a load to be the one that takes the most load before it gives.'
    correction: 'Stiffness is the slope of the straight part of the record: how much stress per unit strain. Strength is where the straight part ends. Glass is about twenty times stiffer than nylon, yet a glass rod snaps at a lower stress than a nylon line carries without complaint.'
