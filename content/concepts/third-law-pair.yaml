title: 'Third-law pairs'
blurb: 'One interaction always has two ends: equal magnitudes, opposite directions, same line — and always on two different bodies, which is why a pair never appears in one sum.'
notation: '\vec F_{\text{A on B}} = -\,\vec F_{\text{B on A}}'
tags:
  - 'up-ch4'
misconceptions:
  - id: 'bigger-exerts-more'
    name: 'The bigger, heavier, faster object pushes harder.'
    signal: 'Says the truck exerts a larger force on the car than the car does on the truck.'
    correction: 'The two forces are one interaction counted twice, and an interaction has no way of knowing which participant is heavier. The observation behind the belief is correct — the car is wrecked and the truck is dented — but that is the *acceleration* differing by the mass ratio, with the forces identical. A majority of students get this wrong even after instruction, which is why it is worth doing slowly.'
  - id: 'third-law-needs-equal-masses'
    name: 'Equal and opposite holds when the two objects are comparable, and breaks when one is much bigger.'
    signal: 'Accepts the law for two skaters and rejects it for a fly hitting a windscreen.'
    correction: 'There is no mass condition anywhere in the law. The fly hits the windscreen exactly as hard as the windscreen hits the fly. What differs by a factor of a million is what that force *does* to each of them, because a = F/m and only one of them has a small m.'
  - id: 'pair-forces-cancel'
    name: 'The pair are equal and opposite, so they cancel and nothing can ever accelerate.'
    signal: 'Concludes that a horse cannot pull a cart because the cart pulls back just as hard.'
    correction: 'Forces cancel only when they are added, and they are added only when they act on the *same* body. The two ends of a pair live on two different bodies and therefore enter two different sums. The horse accelerates because of what the *ground* does to its hooves; the cart accelerates because of what the *harness* does to it.'
  - id: 'pair-must-be-same-kind'
    name: 'Any two equal and opposite forces in the picture are a pair.'
    signal: 'Calls the weight of a book and the table''s push on it an action-reaction pair.'
    correction: 'Three tests, and the third is the one that fails here: equal magnitude, opposite direction, and acting on *different* bodies. Both of those forces act on the book, and they come from two unrelated interactions — one with the Earth, one with the table. The real partner of the book''s weight is the book''s pull on the Earth.'
