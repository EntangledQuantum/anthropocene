title: 'Free-body diagram'
blurb: 'One chosen body, every force acting on it, nothing else — and the acceleration is then the only thing left to read off.'
notation: '\text{one body} \;\to\; \{\vec F_i \text{ on it}\} \;\to\; \vec a'
tags:
  - 'up-ch4'
misconceptions:
  - id: 'fbd-includes-reaction'
    name: 'The reaction force belongs on the diagram too — they are a pair, after all.'
    signal: 'Draws both the table pushing up on the block and the block pushing down on the table, then concludes the net force is zero for that reason.'
    correction: 'A free-body diagram is a diagram of forces on *one* body. The reaction acts on the other body, so it belongs on the other body''s diagram. Putting both on one page produces a sum that is always zero, which would make every object in the universe unaccelerated.'
  - id: 'fbd-shows-velocity'
    name: 'The diagram tells you which way the object is moving.'
    signal: 'Reads a rightward net force as "it is moving right", or refuses to answer without being shown the motion.'
    correction: 'The diagram fixes the acceleration and says nothing whatever about the velocity. A single diagram is consistent with moving right and speeding up, moving left and slowing down, and sitting at rest about to start moving right. What the arrows control is how the velocity is *changing*.'
  - id: 'fbd-needs-a-motion-arrow'
    name: 'Add a velocity arrow to the diagram so you know what is going on.'
    signal: 'Draws v among the force arrows, and then adds it into the sum.'
    correction: 'Velocity is not a force and is measured in different units; it cannot enter a sum of newtons. If you want the velocity on the page, it belongs on a separate picture of the motion — which is exactly why this widget keeps the two panes apart.'
  - id: 'fbd-forces-need-no-source'
    name: 'Draw the arrows you need to make the answer come out.'
    signal: 'Invents a forward force with no agent, or a mysterious "force of motion".'
    correction: 'Every arrow has to be exerted by something you can name: the Earth, the surface, a rope, your hand, the air. If you cannot finish the sentence "this is exerted by ___", the arrow does not exist and should come off the page.'
