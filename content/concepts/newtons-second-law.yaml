title: 'Newton''s second law as a vector budget'
blurb: 'Add every force on one chosen body, divide by its mass, and you have the acceleration — the whole law, and the only thing the sum is allowed to tell you.'
notation: '\vec F_{\text{net}} = \sum_i \vec F_i = m\vec a'
tags:
  - 'up-ch4'
misconceptions:
  - id: 'net-force-follows-velocity'
    name: 'The net force points the way the object is going.'
    signal: 'Draws the net force forward on a car that is braking, or along the path of a ball at the top of its arc.'
    correction: 'The net force points the way the velocity is *changing*, which is often nothing like the way it points. A braking car moves forward with its net force backwards. A ball at the top of its arc moves sideways with its net force straight down. Read the arrow as an instruction to the velocity, not a description of it.'
  - id: 'force-proportional-to-velocity'
    name: 'Twice the net force means twice the speed.'
    signal: 'Uses F = mv, or reasons that a body at rest must have zero net force on it because its speed is zero.'
    correction: 'F = ma. Twice the net force means twice the *rate at which the speed changes*. A body momentarily at rest can have an enormous net force on it — that is exactly the situation of a ball at the top of a bounce, or a stone the instant you let go.'
  - id: 'second-law-is-a-formula-for-force'
    name: 'ma is a force, so it belongs in the sum.'
    signal: 'Writes the net force as the sum of the real forces plus ma, or draws an ma arrow among the others on the diagram.'
    correction: 'The two sides of the equation are different kinds of thing. The left is a sum over interactions with other bodies; the right is a property of this body''s motion. ma never appears in the sum, because nothing exerts it.'
  - id: 'mass-cancels-out'
    name: 'Heavier things accelerate less, always.'
    signal: 'Says a heavy object dropped alongside a light one accelerates more slowly.'
    correction: 'Heavier means more resistance *and*, for gravity specifically, a proportionally larger force. The two scale together and cancel, which is why everything falls at the same rate. For a push that does not scale with mass — your hands on a car — the extra mass is pure penalty and the acceleration really does drop.'
