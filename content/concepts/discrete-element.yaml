title: 'discrete element'
blurb: 'The bulk of a sandpile is not a material you write. Overlap makes a spring; the pile’s slope is the contact law, once.'
notation: 'F_n = k_n \delta - \gamma_n v_n \quad (\delta > 0)'
tags:
  - ch5
misconceptions:
  - id: 'dem-is-md'
    name: 'DEM is molecular dynamics with a different pair potential.'
    signal: 'Looks for a stored V(r) at every distance, or treats grains as molecules of the pile.'
    correction: 'MD’s force comes from a potential that is on at every r (until a cutoff). DEM’s force is identically zero until the discs overlap, then a spring–dashpot. Shrink the grains and you are not converging a PDE of molecules — you are resolving more contacts.'
  - id: 'dem-hard-no-overlap'
    name: 'Grains are rigid, so they never overlap.'
    signal: 'Treats δ = 0 as a hard constraint, or reads any overlap as a bug.'
    correction: 'Soft-sphere DEM is a penalty method for non-overlap. A tiny δ is how a spring stands in for rigidity. Take k → ∞ and overlap vanishes — and so does the explicit time step. True rigidity is a constraint, like SHAKE.'
  - id: 'dem-repose-is-written'
    name: 'The angle of repose is a bulk material parameter you prescribe.'
    signal: 'Looks for a Mohr–Coulomb φ on the pile, or treats the slope as an input to the solver.'
    correction: 'There is no σ(ε) for the bulk. The slope is an output of the contact law — k, γ, μ, rolling resistance — counted out over a network. Change μ, the pile changes. That is the constitutive law.'
  - id: 'dem-frictionless-slopes'
    name: 'Frictionless discs still make a sandpile.'
    signal: 'Expects a 30° heap from smooth circles, or treats geometry as enough to hold a slope.'
    correction: 'Without friction or rolling resistance, discs spread into a monolayer. A finite angle of repose is μ and the resistance to roll, not the fact of being discrete.'
  - id: 'dem-dt-from-free-fall'
    name: 'The time step is set by how long the pile takes to collapse.'
    signal: 'Picks Δt from the free-fall time or the hopper discharge, the way a CFL would track a bulk wave.'
    correction: 'The stiffest thing in the room is the contact spring. t_c ~ π √(m*/k_n) is the duration of a bounce, and Δt has to resolve it. Stiffer k, smaller overlap, smaller Δt. That is why DEM is expensive.'
