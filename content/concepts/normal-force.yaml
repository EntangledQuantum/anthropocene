title: 'The normal force'
blurb: 'A surface pushes perpendicular to itself, by however much it takes, and never pulls — so it is a consequence of everything else, not a rule with a value of its own.'
notation: 'N \ge 0,\quad N = -\,\vec F_{\text{other}} \cdot \hat n'
tags:
  - 'up-ch4'
misconceptions:
  - id: 'normal-always-mg'
    name: 'The normal force equals mg.'
    signal: 'Writes N = mg on a ramp, in a lift, or while somebody is pressing down on the block.'
    correction: 'On a level surface with nothing else touching the body, it happens to equal mg — which is why the belief survives so long. Press down and N grows; pull up and it shrinks; tilt the surface and it becomes mg cos θ; pull up harder than mg and it goes to zero and the body leaves. N takes whatever value stops the body accelerating into the surface, and that value is a result, not a formula.'
  - id: 'normal-force-is-gravity-partner'
    name: 'The normal force is the reaction to gravity.'
    signal: 'Names the weight and the normal force as a third-law pair on a resting book.'
    correction: 'They act on the same body, which already disqualifies them. Gravity''s genuine partner is the body''s pull on the *Earth*; the normal force''s partner is the body''s push down on the *surface*. The giveaway is a lift: start accelerating upward and N changes while the weight does not, which two ends of one interaction could never do.'
  - id: 'surfaces-can-pull'
    name: 'If the block is attached or heavy enough, the surface can hold it down.'
    signal: 'Lets N go negative to keep a body on the surface after an upward pull exceeds its weight.'
    correction: 'A surface can only push. The arithmetic will happily hand you a negative N, and that negative number is the surface telling you it has run out of job: contact has been lost and the body is on its way up. Clamping at zero is not a fudge, it is the physics.'
  - id: 'weightless-means-no-gravity'
    name: 'Astronauts float because there is no gravity up there.'
    signal: 'Explains orbital weightlessness by the absence of gravitational force rather than by free fall.'
    correction: 'Gravity in low orbit is around 90% of its value at the ground, and it is the only reason the station curves around the Earth instead of leaving. What is missing is the *normal force*: nothing is pushing up on the astronaut, so nothing squeezes them and a scale under their feet reads zero. Weightlessness is a statement about contact forces, not about gravity.'
