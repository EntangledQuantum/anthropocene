title: 'Inertia'
blurb: 'Velocity is the thing that persists on its own. A force is needed to change it, never to maintain it — and mass is the measure of how hard it is to change.'
notation: '\vec F_{\text{net}} = 0 \iff \vec v = \text{const}'
tags:
  - 'up-ch4'
misconceptions:
  - id: 'motion-requires-force'
    name: 'Something has to keep pushing, or the motion stops.'
    signal: 'Draws a forward arrow on an object that is coasting at a constant speed, and cannot say who is exerting it.'
    correction: 'The most documented wrong belief in physics, and the top item on the Force Concept Inventory. Constant velocity is the free state: it costs nothing and needs no maintenance. What stops everyday objects is friction and drag, which are forces with sources you can point at. Remove them — a puck on ice, a probe between stars — and the motion simply continues. A forward force does not sustain motion, it changes it.'
  - id: 'force-sustains-speed'
    name: 'A steady push gives a steady speed. Push harder and you get a higher steady speed.'
    signal: 'Predicts that adding a constant forward force to a coasting object settles it at a new constant velocity.'
    correction: 'Force fixes the acceleration, not the velocity. A constant force gives a constant *rate of change* of velocity, so the speed climbs without ever settling. The reason this feels wrong is that in air and on rough ground drag rises with speed until it cancels your push — which is a second force appearing, not your push behaving differently.'
  - id: 'motion-stops-when-force-stops'
    name: 'Take the force away and the object slows back down to where it was.'
    signal: 'Expects the speed to decay to its old value after the push is removed, on a frictionless surface.'
    correction: 'It keeps whatever velocity it had reached. Nothing remembers the old speed; there is no restoring tendency and no natural state of rest. Removing the force removes the acceleration, and that freezes the velocity exactly where it was.'
  - id: 'mass-is-weight'
    name: 'Mass and weight are two words for the same thing.'
    signal: 'Gives a mass in newtons, or says an object on the Moon "has less mass".'
    correction: 'Mass is the resistance to a change of velocity, in kilograms, and it is the same everywhere. Weight is the gravitational force on that mass, in newtons, and it changes when the gravity does. A crate in deep space weighs nothing and is exactly as hard to get moving as it was on the floor.'
