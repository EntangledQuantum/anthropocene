title: 'Dimensional analysis'
blurb: 'Every quantity is a point in the seven-dimensional space of base-dimension exponents; multiplying quantities adds those vectors, and an equation can only be true if both sides land on the same point.'
notation: '[F] = \mathsf{M}\,\mathsf{L}\,\mathsf{T}^{-2}'
tags:
  - 'up-ch1'
misconceptions:
  - id: 'units-are-labels'
    name: 'Units are labels you slap on the answer at the end.'
    signal: 'Does the arithmetic on bare numbers, then appends whatever unit the question used. Cannot say what is wrong with an equation until they have computed both sides numerically.'
    correction: 'The unit travels through every operation because it is part of the quantity. Multiply a length by a length and you have an area whether you wrote it down or not, so the dimensions of an expression are fixed before any number is chosen — which is why a dimensional check can reject a formula you have never evaluated.'
  - id: 'balanced-means-correct'
    name: 'If the dimensions work out, the formula is right.'
    signal: 'Treats a successful dimensional check as a proof, and is surprised when the balanced formula is off by 2π or by a factor of two.'
    correction: 'Dimensional analysis is blind to every pure number. Adding a factor of 2π, of ½, or of a thousand moves the expression nowhere in exponent space. A balanced equation has passed a necessary test, not a sufficient one: it can still be wrong, just not wrong in this particular way.'
  - id: 'trig-eats-anything'
    name: 'You can take the sine of a length, or the log of a mass.'
    signal: 'Writes sin(x) where x is a position in metres, or exp(t) with t in seconds, and sees nothing to fix.'
    correction: 'A sine is a sum of infinitely many powers of its argument, so the argument of any transcendental function has to be dimensionless — otherwise you would be adding a length to a volume. That is why the physical wave is always written sin(kx - \omega t): the k and the \omega are exactly what makes the bracket a pure number.'
  - id: 'balance-catches-unit-errors'
    name: 'A dimensional check catches unit mistakes.'
    signal: 'Checks that both sides are a force and concludes the calculation is safe, even though one side arrived in pounds-force and the other in newtons.'
    correction: 'Dimension answers "is this the same kind of thing"; the unit answers "how much of it". A pound-force second and a newton second occupy the same point in exponent space and differ by a factor of 4.45, so a dimensional audit waves the error straight through. Both checks are needed and they are not the same check.'
