title: 'Partial differential equation'
blurb: 'An equation for a field. The type — elliptic, parabolic, hyperbolic — is which information must enter through the boundary.'
notation: 'u_t = \mathcal{L}u'
tags:
  - ch6
misconceptions:
  - id: 'pde-is-long-ode'
    name: 'A PDE is just an ODE with more components.'
    signal: 'Treats a field as a longer state vector and expects the same data as an initial-value problem.'
    correction: 'A longer list is still an ODE. A PDE asks a new question: which information has to enter through the boundary. That question has three answers, and they are the three types.'
  - id: 'all-pdes-need-same-data'
    name: 'Every PDE needs initial data and both boundary values.'
    signal: 'Specifies u at both ends of an advection problem, or tries to march Poisson in time.'
    correction: 'The type is the data. Elliptic needs the whole boundary and has no time. Parabolic needs the whole past. Hyperbolic needs the characteristic triangle, and only the inflow wall.'
  - id: 'heat-is-finite-speed'
    name: 'Heat spreads at a finite speed, like a wave.'
    signal: 'Draws a triangle for the heat equation, or expects a delay before a pulse is felt far away.'
    correction: 'The heat kernel is strictly positive everywhere the instant t > 0. Infinite speed, exponentially small tails. A wave waits; heat does not.'
  - id: 'outflow-needs-data'
    name: 'You specify the boundary the wave is leaving through.'
    signal: 'Puts a Dirichlet condition on the right end of u_t + u_x = 0 because that is where the signal is going.'
    correction: 'Characteristics carry data with them. For right-going advection they enter at the left wall and leave at the right. The outflow is determined, not prescribed.'
  - id: 'n-equations-n-unknowns'
    name: 'n second differences uniquely determine n samples.'
    signal: 'Treats Poisson as a square linear system before any boundary is set, and expects a unique field.'
    correction: 'The interior second-difference operator has a two-dimensional kernel: constants and ramps. Without a boundary, Poisson does not pick a field. The boundary is the missing data, not a cleanup.'
references:
  - label: 'LeVeque, Finite Difference Methods for Ordinary and Partial Differential Equations (SIAM, 2007)'
    url: 'https://doi.org/10.1137/1.9780898717839'
  - label: 'Evans, Partial Differential Equations (AMS, 2010), ch. 2'
    url: 'https://doi.org/10.1090/gsm/019'
