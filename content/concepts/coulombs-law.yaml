title: 'Coulomb''s law'
blurb: 'Two point charges push or pull on each other along the line joining them, in proportion to each charge and to one over the square of the distance. Twice as far is a quarter the force.'
notation: 'F = k\,\dfrac{|q_1 q_2|}{r^2},\quad k = 8.99\times10^{9}\ \mathrm{N\,m^2/C^2}'
tags:
  - 'up-ch21'
misconceptions:
  - id: 'up-ch21-balance-at-midpoint'
    name: 'A charge between two others balances halfway, whatever their sizes.'
    signal: 'Puts the balance point between +1 and +4 µC at the midpoint.'
    correction: 'At the midpoint the distances are equal, so the +4 pushes four times harder. The balance is where the smaller charge''s nearness makes up for its size: a third of the way from +1, because 2² = 4.'
  - id: 'up-ch21-force-falls-as-distance'
    name: 'The force falls in simple proportion to distance.'
    signal: 'Puts the balance between +1 and +4 µC a fifth of the way along, where the distances are in the ratio 1 : 4.'
    correction: 'Coulomb''s law is an inverse square. Four times the charge is balanced by twice the distance, not four times: the balance is a third of the way along.'
  - id: 'up-ch21-bigger-charge-pushes-harder'
    name: 'The bigger charge pushes harder on the small one than the small one pushes back.'
    signal: 'Draws a longer arrow on the small charge than on the big one.'
    correction: 'Coulomb''s law has the product q₁q₂ in it, which is the same seen from either side. The two forces are equal and opposite, as Newton''s third law demands.'
  - id: 'up-ch21-balanced-means-stable'
    name: 'Where the forces balance, a charge is held in place.'
    signal: 'Expects a charge nudged off a balance point in empty space to be pushed back.'
    correction: 'Balanced is not stable. Between two like charges the pushes restore the bead along the line but push it further off sideways. No arrangement of fixed charges can hold a charge in stable equilibrium on its own (Earnshaw''s theorem).'
  - id: 'up-ch21-vacuum-coulomb-in-matter'
    name: 'Coulomb''s law applies inside matter just as in vacuum.'
    signal: 'Uses k q₁q₂/r² unchanged for two ions in water.'
    correction: 'Matter between the charges polarizes and partly screens them. In water the force between two ions is about 80 times weaker than in vacuum.'
